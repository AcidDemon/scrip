name: Release

on:
  push:
    tags:
      - "v*"

env:
  CARGO_TERM_COLOR: always

# Publishing jobs grant write access only to the resource they publish.
permissions:
  contents: read

jobs:
  build:
    strategy:
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            cross: false
          - target: aarch64-unknown-linux-gnu
            cross: true
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          key: ${{ matrix.target }}
      - name: Install aarch64 cross toolchain
        if: matrix.cross
        run: sudo apt-get update && sudo apt-get install -y gcc-aarch64-linux-gnu
      - name: Test
        if: matrix.target == 'x86_64-unknown-linux-gnu'
        run: cargo test --locked
      - name: Build
        env:
          CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER: aarch64-linux-gnu-gcc
        run: cargo build --locked --release --target ${{ matrix.target }}
      - name: Strip binary
        run: |
          set -euo pipefail
          if [ "${{ matrix.cross }}" = "true" ]; then
            aarch64-linux-gnu-strip "target/${{ matrix.target }}/release/scrip"
          else
            strip "target/${{ matrix.target }}/release/scrip"
          fi
      - name: Package
        env:
          TARGET: ${{ matrix.target }}
        run: |
          set -euo pipefail
          stage="scrip-${TARGET}"
          mkdir -p "$stage"
          cp "target/${TARGET}/release/scrip" "$stage/"
          cp -r deploy "$stage/deploy"
          cp LICENSE README.md "$stage/"
          tar czf "${stage}.tar.gz" "$stage"
          sha256sum "${stage}.tar.gz" > "${stage}.tar.gz.sha256"
      # x86_64 only: cargo-deb would need the cross linker wired up for arm64.
      - name: Build .deb
        if: ${{ !matrix.cross }}
        run: |
          set -euo pipefail
          cargo install cargo-deb --locked
          cargo deb --locked --target ${{ matrix.target }}
          cp "target/${{ matrix.target }}/debian/"scrip_*.deb .
          for f in scrip_*.deb; do sha256sum "$f" > "$f.sha256"; done
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: scrip-${{ matrix.target }}
          path: |
            scrip-${{ matrix.target }}.tar.gz
            scrip-${{ matrix.target }}.tar.gz.sha256
            scrip_*.deb
            scrip_*.deb.sha256

  container:
    needs: build
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    env:
      ARCH: ${{ matrix.arch }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: Build image
        run: |
          set -euo pipefail
          image="ghcr.io/${GITHUB_REPOSITORY,,}:${GITHUB_REF_NAME}-${ARCH}"
          docker build --file Containerfile --platform "linux/${ARCH}" \
            --label "org.opencontainers.image.source=https://github.com/${GITHUB_REPOSITORY}" \
            --label "org.opencontainers.image.revision=${GITHUB_SHA}" \
            --label "org.opencontainers.image.version=${GITHUB_REF_NAME}" \
            --tag "$image" .
          echo "IMAGE=$image" >> "$GITHUB_ENV"
      - name: Test image
        run: bash scripts/container-smoke.sh "$IMAGE"
      - name: Push tested image
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          printf '%s' "$GH_TOKEN" | docker login ghcr.io --username "$GITHUB_ACTOR" --password-stdin
          docker push "$IMAGE"
      - name: Log out
        if: always()
        run: docker logout ghcr.io

  # Keep per-architecture tags: deleting their GHCR versions would also remove
  # the images referenced by the multi-platform manifest.
  publish-container:
    needs: container
    runs-on: ubuntu-24.04
    permissions:
      packages: write
    steps:
      - name: Publish multi-platform image
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          image="ghcr.io/${GITHUB_REPOSITORY,,}"
          printf '%s' "$GH_TOKEN" | docker login ghcr.io --username "$GITHUB_ACTOR" --password-stdin
          tags=(--tag "$image:$GITHUB_REF_NAME")
          if [[ "$GITHUB_REF_NAME" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            tags+=(--tag "$image:latest")
          fi
          docker buildx imagetools create "${tags[@]}" \
            "$image:${GITHUB_REF_NAME}-amd64" \
            "$image:${GITHUB_REF_NAME}-arm64"
      - name: Log out
        if: always()
        run: docker logout ghcr.io

  release:
    needs: [build, publish-container]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          path: dist
          merge-multiple: true
      - name: Release
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2.6.2
        with:
          files: |
            dist/*.tar.gz
            dist/*.tar.gz.sha256
            dist/*.deb
            dist/*.deb.sha256
