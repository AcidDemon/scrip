# Per-source connection cap FIRST (accept would end evaluation),
# then the rate limit. Load this file first, then layer the ban set on top:
#   nft -f nftables-scrip.conf
#   scrip ban export > bans.nft && nft -f bans.nft
# (via a file, not a pipe: a pipeline reports only nft's exit status, so a
# failing export would look like a successful load of nothing).
# Reloading this file is safe: the delete/create pair below is atomic inside
# one nft transaction. The export must still run after it, because the delete
# drops the ban elements along with the table.
table inet scrip {}
delete table inet scrip

table inet scrip {
    # The timeout flag is what lets a temporary auto-ban expire in the kernel
    # instead of persisting until reboot.
    set scrip_bans4 { type ipv4_addr; flags interval,timeout; }
    set scrip_bans6 { type ipv6_addr; flags interval,timeout; }
    set conns4 { type ipv4_addr; flags dynamic; size 65535; }
    set conns6 { type ipv6_addr; flags dynamic; size 65535; }
    set conns48 { type ipv6_addr; flags dynamic; size 65535; }
    set flood4 { type ipv4_addr; flags dynamic; timeout 2m; size 65535; }
    set flood6 { type ipv6_addr; flags dynamic; timeout 2m; size 65535; }
    set flood48 { type ipv6_addr; flags dynamic; timeout 2m; size 65535; }

    chain input {
        type filter hook input priority 0; policy accept;
        ip saddr @scrip_bans4 tcp dport 9999 drop
        ip6 saddr @scrip_bans6 tcp dport 9999 drop
        # Both counters key on the same thing the app and the rate rules do:
        # the address for v4, the /64 for v6. Counting v6 per /128 would let one
        # /64 open unlimited connections by walking its host part.
        tcp dport 9999 ct state new add @conns4 { ip saddr ct count over 10 } drop
        tcp dport 9999 ct state new add @conns6 { ip6 saddr and ffff:ffff:ffff:ffff:: ct count over 10 } drop
        # Per-source connect rate; v6 keyed on the /64 to match the app's source keying.
        tcp dport 9999 ct state new add @flood4 { ip saddr limit rate over 30/minute } drop
        tcp dport 9999 ct state new add @flood6 { ip6 saddr and ffff:ffff:ffff:ffff:: limit rate over 30/minute } drop
        # One routed /48 is 65,536 /64 identities, so a per-/64 cap alone is
        # rotated around. 8x the /64 values, matching the app's own /48 tier.
        tcp dport 9999 ct state new add @conns48 { ip6 saddr and ffff:ffff:ffff:: ct count over 80 } drop
        tcp dport 9999 ct state new add @flood48 { ip6 saddr and ffff:ffff:ffff:: limit rate over 240/minute } drop
        # Backstop only, sized above aggregate legitimate load; per-source rules above do the real limiting.
        tcp dport 9999 ct state new limit rate over 2000/minute drop
    }
}
